<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Object Detection + Engagement Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            background: #f0f1ff;
            border-color: #764ba2;
        }

        .upload-section input {
            display: none;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-section p {
            color: #666;
            margin-bottom: 10px;
        }

        .upload-section button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .upload-section button:hover {
            background: #764ba2;
        }

        .file-name {
            color: #764ba2;
            font-weight: 600;
            margin-top: 10px;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-image {
            width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .analysis-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
        }

        .analysis-card.high {
            border-left-color: #ff6b6b;
        }

        .analysis-card.moderate {
            border-left-color: #ffd93d;
        }

        .analysis-card.low {
            border-left-color: #6bcf7f;
        }

        .analysis-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .analysis-value {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        .analysis-subtext {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .score-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: #667eea;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .engagement-details {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
        }

        .detail-value {
            color: #333;
        }

        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .success {
            background: #e0f7e0;
            color: #388e3c;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YOLO Object Detection</h1>
        <p class="subtitle">With Engagement & Emotion Analysis</p>

        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📤</div>
            <p>Click to upload or drag and drop</p>
            <p style="font-size: 12px; color: #999;">PNG, JPG, GIF up to 10MB</p>
            <button type="button">Choose File</button>
            <input type="file" id="fileInput" accept="image/*">
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="results" id="results">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Analyzing image...</p>
            </div>

            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const results = document.getElementById('results');
        const resultsContent = document.getElementById('resultsContent');
        const loading = document.getElementById('loading');

        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileName.textContent = `Selected: ${file.name}`;
            uploadAndAnalyze(file);
        }

        function uploadAndAnalyze(file) {
            const formData = new FormData();
            formData.append('file', file);

            results.classList.add('active');
            loading.style.display = 'block';
            resultsContent.innerHTML = '';

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                displayResults(data);
            })
            .catch(error => {
                loading.style.display = 'none';
                resultsContent.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            });
        }

        function displayResults(data) {
            if (!data.success) {
                resultsContent.innerHTML = `<div class="error">❌ Error: ${data.error}</div>`;
                return;
            }

            let html = '';

            // Display detected image
            if (data.image_path) {
                html += `<img src="${data.image_path}" alt="Detection Result" class="result-image">`;
            }

            // Detection count
            html += `
                <div class="analysis-grid">
                    <div class="analysis-card">
                        <div class="analysis-label">Objects Detected</div>
                        <div class="analysis-value">${data.detections}</div>
                    </div>
            `;

            // Engagement Analysis
            if (data.overall_listening !== undefined) {
                const listeningColor = data.overall_listening === 'YES' ? 'low' : 'high';
                const frustrationColor = data.frustration_score > 0.6 ? 'high' : data.frustration_score > 0.3 ? 'moderate' : 'low';

                html += `
                    <div class="analysis-card ${listeningColor}">
                        <div class="analysis-label">Is Person Listening?</div>
                        <div class="analysis-value">${data.overall_listening}</div>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${data.listening_score * 100}%; background: ${data.overall_listening === 'YES' ? '#6bcf7f' : '#ff6b6b'};"></div>
                        </div>
                        <div class="analysis-subtext">Confidence: ${(data.listening_score * 100).toFixed(1)}%</div>
                    </div>

                    <div class="analysis-card ${frustrationColor}">
                        <div class="analysis-label">Frustration Level</div>
                        <div class="analysis-value">${data.frustration_level}</div>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${data.frustration_score * 100}%; background: ${data.frustration_score > 0.6 ? '#ff6b6b' : data.frustration_score > 0.3 ? '#ffd93d' : '#6bcf7f'};"></div>
                        </div>
                        <div class="analysis-subtext">Score: ${(data.frustration_score * 100).toFixed(1)}%</div>
                    </div>
                `;

                // Detailed engagement info
                if (data.engagement_analysis && data.engagement_analysis.length > 0) {
                    const engagement = data.engagement_analysis[0];
                    html += `
                        <div class="engagement-details">
                            <h3 style="margin-bottom: 15px; color: #333;">📊 Detailed Engagement Metrics</h3>
                            <div class="detail-item">
                                <span class="detail-label">Listening Confidence:</span>
                                <span class="detail-value">${(engagement.listening_confidence * 100).toFixed(1)}%</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Head Angle:</span>
                                <span class="detail-value">${engagement.head_angle.toFixed(1)}°</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Mouth Width:</span>
                                <span class="detail-value">${engagement.mouth_width.toFixed(3)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Eye Openness:</span>
                                <span class="detail-value">${engagement.eye_openness.toFixed(3)}</span>
                            </div>
                        </div>
                    `;
                }
            }

            html += `</div>`;
            resultsContent.innerHTML = html;
        }

        // Drag and drop support
        const uploadSection = document.querySelector('.upload-section');
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.style.background = '#f0f1ff';
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.style.background = '#f8f9fa';
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.style.background = '#f8f9fa';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                fileName.textContent = `Selected: ${file.name}`;
                uploadAndAnalyze(file);
            }
        });
    </script>
</body>
</html>
